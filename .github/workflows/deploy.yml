name: Test and deploy subway
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subway-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate deployment contract
        run: |
          python3 infra/aws/test_infra.py
          bash -n infra/aws/deploy.sh
          docker compose config --quiet
      - name: Backend tests
        run: docker compose --profile test run --build --rm tests
      - name: Production images and integration
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          python3 scripts/smoke_compose.py
      - name: Browser tests against Compose
        run: |
          npm --prefix frontend ci
          (cd frontend && npx playwright install --with-deps chromium)
          frontend/node_modules/.bin/playwright test --config docker/playwright.compose.config.mjs
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100
          docker compose down
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: subway-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Build and publish immutable ARM images
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for SERVICE in backend frontend; do
            if aws ecr describe-images --repository-name "subway/$SERVICE" --image-ids imageTag="$COMMIT_SHA" > /dev/null 2>/tmp/ecr-check.err; then
              echo "Reuse immutable $SERVICE image for this commit"
            elif grep -q ImageNotFoundException /tmp/ecr-check.err; then
              docker build --target runtime -f "docker/$SERVICE.Dockerfile" \
                --label "org.opencontainers.image.revision=$COMMIT_SHA" \
                -t "$REGISTRY/subway/$SERVICE:$COMMIT_SHA" .
              docker push "$REGISTRY/subway/$SERVICE:$COMMIT_SHA"
            else
              cat /tmp/ecr-check.err >&2
              exit 1
            fi
          done
          docker logout "$REGISTRY"
      - name: Deploy through restricted SSM document
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" --document-name subway-deploy \
            --parameters "CommitSha=$COMMIT_SHA" --timeout-seconds 600 \
            --comment "GitHub $GITHUB_RUN_ID commit $COMMIT_SHA" \
            --query Command.CommandId --output text)
          for ATTEMPT in $(seq 1 210); do
            if aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" > /tmp/deploy-status.json 2>/tmp/deploy-status.err; then
              STATUS=$(jq -r .Status /tmp/deploy-status.json)
              case "$STATUS" in
                Success)
                  jq -r .StandardOutputContent /tmp/deploy-status.json
                  echo "Deployed commit $COMMIT_SHA to Seoul EC2" >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) jq '{Status,StandardOutputContent,StandardErrorContent}' /tmp/deploy-status.json; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist /tmp/deploy-status.err; then
              cat /tmp/deploy-status.err >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Deployment wait timed out. Inspect the SSM command before retrying.' >&2
          exit 1
