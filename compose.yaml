name: subway

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:-subway-backend:local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    environment:
      SQLITE_PATH: /app/var/subway.sqlite3
      TZ: Asia/Seoul
    volumes:
      - sqlite-data:/app/var
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-subway-frontend:local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      METRO_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging

  tests:
    profiles: ["test"]
    image: subway-backend-tests:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: test
    environment:
      TZ: Asia/Seoul

volumes:
  sqlite-data:
